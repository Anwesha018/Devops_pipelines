name: CI Pipeline

on:
 push:
   branch: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
     - name: Checkout code
       uses: actions/checkout@v5

     - name: Set up nodejs
       uses: actions/setup-node@v3
       with:
        node-version: 26

     - name: Install Depependencies
       run: npm install

     - name: Run Tests
       run: npm test